[package]
name = "comparecraft"
version = "0.1.0"
description = "CompareCraft - compare, merge and synchronize files and folders"
authors = ["CompareCraft contributors"]
edition = "2021"
license = "MIT"
default-run = "comparecraft"

[lib]
name = "comparecraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "comparecraft"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
encoding_rs = "0.8"
crc32fast = "1.4"
dirs = "6"
trash = "5"
base64 = "0.22"
tauri-plugin-opener = "2"
filetime = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
