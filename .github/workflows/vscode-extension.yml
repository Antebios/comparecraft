name: vscode-extension

# Tests and packages the VS Code extension. Marketplace publishing is opt-in
# through a manual run on main, after all platform checks pass.
on:
  push:
    branches: [main]
    paths:
      - "extensions/vscode/**"
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "vite*.config.*"
      - ".github/workflows/vscode-extension.yml"
  pull_request:
    paths:
      - "extensions/vscode/**"
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "vite*.config.*"
      - ".github/workflows/vscode-extension.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested VSIX to the Visual Studio Marketplace
        type: boolean
        default: false
      version:
        description: Exact extension version to publish (must match extensions/vscode/package.json)
        type: string
        required: false

permissions:
  contents: read

jobs:
  extension:
    name: Extension (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extensions/vscode/package-lock.json
      # - name: Validate publish request
      #   if: github.event_name == 'workflow_dispatch' && inputs.publish
      #   env:
      #     RELEASE_VERSION: ${{ inputs.version }}
      #   run: |
      #     node <<'NODE'
      #     const { version, publisher } = require("./extensions/vscode/package.json");
      #     if (process.env.GITHUB_REF !== "refs/heads/main") {
      #       throw new Error("Marketplace releases must run from main.");
      #     }
      #     if (process.env.RELEASE_VERSION !== version) {
      #       throw new Error(`Enter the exact extension version (${version}) to publish.`);
      #     }
      #     if (publisher !== "MacrossPlusInc") {
      #       throw new Error("Expected Marketplace publisher MacrossPlusInc.");
      #     }
      #     NODE
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }
      - name: Build Windows shell-extension resources
        if: runner.os == 'Windows'
        run: node scripts/build-windows-shell-extension.mjs
      - name: Build the embedded backend helper
        run: cargo build --bin comparecraft-backend
        working-directory: src-tauri
      - name: Point tests at the helper
        run: echo "COMPARECRAFT_BACKEND=$GITHUB_WORKSPACE/src-tauri/target/debug/comparecraft-backend${{ runner.os == 'Windows' && '.exe' || '' }}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm ci
        working-directory: extensions/vscode
      - name: Unit and contract tests
        run: npm test
        working-directory: extensions/vscode
      - name: Package VSIX (no publish)
        run: npm run package
        working-directory: extensions/vscode
      - name: Install, upgrade, host-test and uninstall the VSIX
        working-directory: extensions/vscode
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:vsix
          else
            npm run test:vsix
          fi
      - name: Upload VSIX
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: comparecraft-vscode-vsix
          path: extensions/vscode/*.vsix
          if-no-files-found: error

  publish:
    name: Publish to VS Code Marketplace
    needs: extension
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    environment: vscode-marketplace
    concurrency:
      group: vscode-marketplace-publish
      cancel-in-progress: false
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: comparecraft-vscode-vsix
          path: ${{ runner.temp }}/vsix
      - name: Publish the tested VSIX
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "Set the VSCE_PAT secret in the vscode-marketplace environment."
            exit 1
          fi
          npx --no-install vsce publish --packagePath "$RUNNER_TEMP/vsix/comparecraft-${RELEASE_VERSION}.vsix"
