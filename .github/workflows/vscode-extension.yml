name: vscode-extension

# Tests and packages the VS Code extension on CI and release runs.
# Only release creation publishes, after all platform checks pass.
on:
  push:
    branches: [main]
    paths:
      - "extensions/vscode/**"
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "vite*.config.*"
      - ".github/workflows/vscode-extension.yml"
  pull_request:
    paths:
      - "extensions/vscode/**"
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "vite*.config.*"
      - ".github/workflows/vscode-extension.yml"
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  extension:
    name: Extension (${{ matrix.os }})
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extensions/vscode/package-lock.json
      - name: Set extension version from release tag
        id: release-version
        if: github.event_name == 'release'
        working-directory: extensions/vscode
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must use the format vN.N.N (for example, v1.2.3)."
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          npm version "$version" --no-git-tag-version --allow-same-version --ignore-scripts
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }
      - name: Build Windows shell-extension resources
        if: runner.os == 'Windows'
        run: node scripts/build-windows-shell-extension.mjs
      - name: Build the embedded backend helper
        run: cargo build --bin comparecraft-backend
        working-directory: src-tauri
      - name: Point tests at the helper
        run: echo "COMPARECRAFT_BACKEND=$GITHUB_WORKSPACE/src-tauri/target/debug/comparecraft-backend${{ runner.os == 'Windows' && '.exe' || '' }}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm ci
        working-directory: extensions/vscode
      - name: Unit and contract tests
        run: npm test
        working-directory: extensions/vscode
      - name: Package VSIX (no publish)
        run: npm run package
        working-directory: extensions/vscode
      - name: Install, upgrade, host-test and uninstall the VSIX
        working-directory: extensions/vscode
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:vsix
          else
            npm run test:vsix
          fi
      - name: Upload VSIX
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: comparecraft-vscode-vsix
          path: extensions/vscode/*.vsix
          if-no-files-found: error

  publish:
    name: Publish to VS Code Marketplace
    needs: extension
    if: github.event_name == 'release' && github.event.action == 'created'
    runs-on: ubuntu-22.04
    environment: vscode-marketplace
    concurrency:
      group: vscode-marketplace-publish
      cancel-in-progress: false
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: comparecraft-vscode-vsix
          path: ${{ runner.temp }}/vsix
      - name: Publish the tested VSIX
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          RELEASE_VERSION: ${{ needs.extension.outputs.version }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "Set the VSCE_PAT secret in the vscode-marketplace environment."
            exit 1
          fi
          npx --no-install vsce publish --packagePath "$RUNNER_TEMP/vsix/comparecraft-${RELEASE_VERSION}.vsix"
