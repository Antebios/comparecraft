name: docs

on:
  push:
    branches: [main]
    paths: ["docs/manual/**", "mkdocs.yml", "docs/requirements.txt", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/manual/**", "mkdocs.yml", "docs/requirements.txt"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: docs/requirements.txt }
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with: { path: site }

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
