name: build

on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }
      - run: npm ci
      - run: npm run build
      - run: cargo test
        working-directory: src-tauri

  bundle:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: "CompareCraft ${{ github.ref_name }}"
          releaseDraft: true
          args: ${{ matrix.args }}
      - name: Package and upload Windows portable ZIP
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          $version = (Get-Content -Raw "src-tauri/tauri.conf.json" | ConvertFrom-Json).version
          $zipName = "CompareCraft-$version-windows-portable.zip"
          $staging = Join-Path $env:RUNNER_TEMP "comparecraft-portable"
          $zipPath = Join-Path $env:RUNNER_TEMP $zipName

          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item "src-tauri/target/release/comparecraft.exe" (Join-Path $staging "comparecraft.exe")
          Copy-Item "packaging/windows/README-portable.txt" (Join-Path $staging "README.txt")
          Compress-Archive -Path (Join-Path $staging "*") -DestinationPath $zipPath -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName } | Sort-Object)
            $expectedEntries = @("comparecraft.exe", "README.txt") | Sort-Object
            if (($entries -join "`n") -ne ($expectedEntries -join "`n")) {
              throw "Unexpected portable ZIP contents: $($entries -join ', ')"
            }
          } finally {
            $archive.Dispose()
          }

          if (-not $env:RELEASE_ID) {
            throw "Tauri action did not return a GitHub release ID."
          }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Could not retrieve the GitHub release."
          }
          gh release upload $release.tag_name $zipPath --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Could not upload the Windows portable ZIP."
          }
